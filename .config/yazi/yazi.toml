[mgr]
sort_dir_first = true
sort_reverse = false
sort_by = "natural"


# kinda stupid workaround rnote "FILE_NAME" always opens the file in the most recent window
# Might stop working in the future for that reason
[[opener.rnote]]
run = 'gapplication action com.github.flxzt.rnote new-window && rnote "$@"'
orphan = true
for = "unix"

[[open.prepend_rules]]
url = "*.rnote"
use = "rnote"
